[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-portfolio"
version = "0.1.0"
description = "Reproducible Monte Carlo portfolio research for MTH40A/B"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2.2,<3", "scipy>=1.15,<2"]

[project.scripts]
thesis-portfolio = "thesis_portfolio.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "setuptools==80.9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
